[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-optimizer"
version = "0.1.0"
description = "Multi-channel revenue optimization engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Coding-Dev-Tools", email = "algorithmictradingsolutions@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["revenue", "optimization", "analytics", "affiliate", "seo", "marketing"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
revenue-optimizer = "main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data*", "output*", "tests*", "__pycache__*"]

[tool.ruff]
target-version = "py38"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "T20"]
ignore = []
lint.select = ["E", "F", "I", "UP", "B", "C4", "T20"]
lint.ignore = []
lint.extend-ignore = ["E501", "B008"]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"